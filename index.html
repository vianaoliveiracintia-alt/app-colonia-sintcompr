<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colônia de Férias – SINTCOM-PR</title>
<meta name="description" content="Reservas da Colônia de Férias do SINTCOM-PR">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b5d7a">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colônia SINTCOM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #f4f7f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; overflow: hidden; }
  #sistema { display: block; width: 100%; height: 100%; border: 0; background: #f4f7f9; }
  .tela { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
          background: linear-gradient(160deg, #0e6f91, #0a4f69); color: #fff; padding: 24px; z-index: 10; transition: opacity .35s; }
  .tela.some { opacity: 0; pointer-events: none; }
  .tela img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .tela h1 { font-size: 22px; margin: 18px 0 4px; }
  .tela p { margin: 6px 0; opacity: .92; font-size: 15px; max-width: 420px; line-height: 1.45; }
  .giro { width: 30px; height: 30px; margin-top: 22px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .botoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .bt { background: #f2a541; color: #1f2d3a; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; }
  .bt.cl { background: rgba(255,255,255,.16); color: #fff; }
  .oculto { display: none !important; }
  #instalar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20; background: #fff; color: #1f2d3a;
              border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 14px 14px 12px; display: flex; gap: 12px; align-items: center; max-width: 560px; margin: 0 auto; }
  #instalar img { width: 46px; height: 46px; border-radius: 11px; flex: none; }
  #instalar .tx { flex: 1; font-size: 14px; line-height: 1.4; }
  #instalar .tx b { display: block; font-size: 15px; }
  #instalar .bt { padding: 10px 14px; font-size: 14px; }
  #instalar .x { background: none; border: 0; font-size: 22px; color: #5f6f7e; cursor: pointer; padding: 0 4px; align-self: flex-start; }
</style>
<script>/* sempre o config.js mais recente (evita a cópia antiga guardada pelo navegador) */ document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');</script>
</head>
<body>
  <iframe id="sistema" title="Colônia de Férias – SINTCOM-PR" allow="camera; clipboard-write; fullscreen"></iframe>

  <div id="abertura" class="tela">
    <img src="icon-192.png" alt="">
    <h1>Colônia de Férias</h1>
    <p>SINTCOM-PR</p>
    <div class="giro" id="giro"></div>
    <p id="msg" style="margin-top:14px">Carregando…</p>
    <div class="botoes oculto" id="acoes">
      <button class="bt" onclick="carregar()">Tentar de novo</button>
      <a class="bt cl" id="abrirNav" target="_blank" rel="noopener">Abrir no navegador</a>
    </div>
  </div>

  <div id="instalar" class="oculto">
    <img src="icon-192.png" alt="">
    <div class="tx"><b>Instale o app da Colônia</b><span id="instTexto">Acesse as reservas direto da tela inicial do celular.</span></div>
    <button class="bt oculto" id="instBotao">Instalar</button>
    <button class="x" onclick="fecharInstalar()" aria-label="Fechar">×</button>
  </div>

<script>
  const ifr = document.getElementById('sistema'), ab = document.getElementById('abertura');
  const msg = document.getElementById('msg'), giro = document.getElementById('giro'), acoes = document.getElementById('acoes');
  const configurado = typeof URL_SISTEMA === 'string' && /^https:\/\/script\.google\.com\/.+\/exec/.test(URL_SISTEMA.trim());
  let timer = null, carregou = false;

  function mostrar(texto, comAcoes, girando) {
    ab.classList.remove('some'); msg.textContent = texto;
    acoes.classList.toggle('oculto', !comAcoes); giro.classList.toggle('oculto', !girando);
  }
  function carregar() {
    if (!configurado) { mostrar('O link do sistema ainda não foi configurado no arquivo config.js.', false, false); return; }
    if (!navigator.onLine) { mostrar('Sem internet. Verifique a conexão e toque em "Tentar de novo".', true, false); return; }
    carregou = false; mostrar('Carregando…', false, true);
    document.getElementById('abrirNav').href = URL_SISTEMA.trim();
    ifr.src = URL_SISTEMA.trim();
    clearTimeout(timer);
    timer = setTimeout(() => { if (!carregou) mostrar('Está demorando mais que o normal…', true, true); }, 25000);
  }
  ifr.addEventListener('load', () => {
    if (!ifr.src) return;
    carregou = true; clearTimeout(timer);
    setTimeout(() => { ab.classList.add('some'); oferecerInstalacao(); }, 250);
  });
  window.addEventListener('offline', () => mostrar('Sem internet. Verifique a conexão e toque em "Tentar de novo".', true, false));
  window.addEventListener('online', () => { if (!carregou) carregar(); });

  /* ---------- convite para instalar (só aparece no navegador, não no app já instalado) ---------- */
  const instalado = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let pedido = null;
  function jaFechou() { try { return localStorage.getItem('instalarFechado') === '1'; } catch (e) { return false; } }
  function fecharInstalar() { document.getElementById('instalar').classList.add('oculto'); try { localStorage.setItem('instalarFechado', '1'); } catch (e) { } }
  window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); pedido = ev; oferecerInstalacao(); });
  function oferecerInstalacao() {
    if (instalado || jaFechou() || !carregou) return;
    const caixa = document.getElementById('instalar'), bt = document.getElementById('instBotao'), tx = document.getElementById('instTexto');
    if (pedido) {
      bt.classList.remove('oculto'); caixa.classList.remove('oculto');
      bt.onclick = async () => { pedido.prompt(); const r = await pedido.userChoice; pedido = null; if (r.outcome === 'accepted') caixa.classList.add('oculto'); };
    } else if (ehIOS) {
      tx.innerHTML = 'No iPhone: toque em <b style="display:inline">Compartilhar</b> (o quadrado com a seta ↑) e depois em <b style="display:inline">“Adicionar à Tela de Início”</b>.';
      caixa.classList.remove('oculto');
    }
  }
  window.addEventListener('appinstalled', () => document.getElementById('instalar').classList.add('oculto'));

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  carregar();
</script>
</body>
</html>
